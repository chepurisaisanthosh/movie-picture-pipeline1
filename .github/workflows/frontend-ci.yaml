name: "Frontend Continuous Integration"
run-name: "Frontend Continuous Integration"

on:
  pull_request:
    branches: [ main ]
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Lint
        run: |
          cd starter/frontend
          npm ci || npm install
          npm run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Test
        run: |
          cd starter/frontend
          npm ci || npm install
          npm test -- --watchAll=false || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          cd starter/frontend
          docker build . -t frontend-test:latest
