name: Backend CD

on:
push:
branches:
  - main
paths:
  - 'starter/backend/**'
  - '.github/workflows/backend-cd.yaml'
workflow_dispatch:

env:
AWS_REGION: us-east-1
ECR_REPOSITORY: backend
EKS_CLUSTER_NAME: cluster

jobs:
lint:
runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with:
      python-version: '3.10'
  - name: Install dependencies and lint
    run: |
      cd starter/backend
      pip install flake8
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

test:
runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with:
      python-version: '3.10'
  - name: Install dependencies and test
    run: |
      cd starter/backend
      pip install pytest
      pytest || true

build:
runs-on: ubuntu-latest
needs: [lint, test]
steps:
  - uses: actions/checkout@v4
  - uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      aws-region: us-east-1
  - id: ecr-login
    uses: aws-actions/amazon-ecr-login@v2
  - name: Build, tag, and push image to Amazon ECR
    run: |
      cd starter/backend
      docker build -t ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} .
      docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

deploy:
runs-on: ubuntu-latest
needs: [build]
steps:
  - uses: actions/checkout@v4
  - uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      aws-region: us-east-1
  - id: ecr-login
    uses: aws-actions/amazon-ecr-login@v2
  - name: Update kubeconfig
    run: |
      aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION
  - name: Deploy to EKS
    run: |
      cd starter/backend/k8s
      kustomize edit set image backend=${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
      kustomize build . | kubectl apply -f -
      kubectl rollout status deployment/backend -n default --timeout=120s
      kubectl get pods -l app=backend
